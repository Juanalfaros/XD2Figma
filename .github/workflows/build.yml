name: Build desktop release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui
        env:
          CI: 'true'
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --no-default-features --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --bins

  package:
    name: Package ${{ matrix.name }}
    needs: check
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-AppleSilicon
            runner: macos-15
            bundle: dmg
          - name: Windows-x64
            runner: windows-latest
            bundle: msi,nsis
          - name: Linux-x64
            runner: ubuntu-24.04
            bundle: appimage,deb
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2t64
      - run: pnpm install --frozen-lockfile
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Package custom macOS installer
        if: runner.os == 'macOS'
        run: pnpm package:mac
      - name: Package Windows or Linux
        if: runner.os != 'macOS'
        run: pnpm tauri build --bundles ${{ matrix.bundle }} -- --locked
      - name: Collect installers and checksums
        shell: python
        run: |
          import hashlib, pathlib, shutil
          output = pathlib.Path('release-assets')
          output.mkdir(exist_ok=True)
          files = list(pathlib.Path('.').glob('XD2Figma_*.dmg'))
          bundle = pathlib.Path('src-tauri/target/release/bundle')
          files += [p for p in bundle.rglob('*') if p.is_file() and p.suffix in {'.msi', '.exe', '.AppImage', '.deb'}]
          if not files:
              raise SystemExit('No installers generated')
          for source in files:
              target = output / source.name
              shutil.copy2(source, target)
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              target.with_name(target.name + '.sha256').write_text(f'{digest}  {target.name}\n')
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: xd2figma-${{ github.ref_name }}-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Attach installers to GitHub Release
    needs: package
    if: always() && !cancelled() && needs.package.result != 'skipped' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: xd2figma-${{ github.ref_name }}-*
          path: release-assets
          merge-multiple: true
      - name: Create release if needed and attach installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --title "XD2Figma $RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
